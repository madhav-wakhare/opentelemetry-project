name: product-catalog-ci
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Build
        working-directory: src/product-catalog-service
        run: go build -o product-catalog-service .

      - name: Unit tests
        working-directory: src/product-catalog-service
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.56.2
          working-directory: src/product-catalog-service

  docker:
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/product-catalog-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }}

  Update-k8s-deployment-manifest:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update k8s deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }}|" ./kubernetes/product-catalog/deploy.yaml
          # sed command explanation:
          # -i: edit the file in place
          # "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }}|": this is the substitution command that replaces the line starting with "image: " with the new image name and tag

      - name: Commit and push changes
        run: |
          git config --global user.name "Madhav Wakhare"
          git config --global user.email "wakharemadhav@gmail.com"
          git add ./kubernetes/product-catalog/deploy.yaml
          git commit -m "[CI]: Update product-catalog deployment image to ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }}"
          git push origin main
